# SeasonalityAgent tunables. See docs/plan/section_agents.md section 3.
day_of_week:
  enabled: true
  lookback_years: 5
turn_of_month:
  enabled: true
  window_days: [-1, 3]        # last trading day of month through +3
pead:
  enabled: true
  drift_window_days: 60       # post-earnings-announcement drift decay window
sector_seasonality:
  enabled: true
  lookback_years: 10
