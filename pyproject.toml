[project]
name = "market-alpha-agents"
version = "0.1.0"
description = "Local multi-agent research system for manual stock/crypto day-swing decision support"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-ollama>=0.2",
  "pydantic-settings>=2.4",
  "ta>=0.11",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "yfinance>=0.2.40",
  "ccxt>=4.3",
  "requests>=2.32",
  "httpx>=0.27",
  "apscheduler==3.*",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "duckdb>=1.0",
  "diskcache>=5.6",
  "feedparser>=6.0",
]

[project.optional-dependencies]
backtesting = [
  "vectorbt>=1.1",
  "plotly<7",  # vectorbt 1.1.0 (latest as of Aug 2026) crashes on import against
               # plotly>=7 -- its bundled theme config references the "scattermapbox"
               # trace name, which newer plotly renamed to "scattermap". Verified live:
               # pinning plotly<7 (resolves to 6.9.0) fixes the import cleanly.
  "quantstats>=0.0.62",
  # bt and zipline-reloaded are intentionally excluded: both lag current Python
  # support significantly (zipline-reloaded's own dependency chain has a long
  # history of trailing new CPython releases) -- not verified working on 3.13
  # here, and not worth the compatibility risk when vectorbt alone covers the
  # signal-level backtesting this phase actually needs.
  # freqtrade is intentionally excluded here -- it is opinionated about owning
  # its own virtualenv and should be installed separately when the crypto leg
  # of backtesting is built (not done in this pass -- see README).
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
markers = [
  "network: test makes real network calls to a live vendor API",
]
